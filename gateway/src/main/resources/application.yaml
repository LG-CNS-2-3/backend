server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: backend-map
              uri: lb://backend-map
              predicates:
                - Path=/api/v1/maps/**

            - id: backend-map-swagger
              uri: lb://backend-map
              predicates:
                - Path=/api/v1/backend-map/**
              filters:
                - RewritePath=/api/v1/backend-map/(?<segment>.*), /api/v1/${segment}

            - id: backend-core
              uri: lb://backend-core
              predicates:
                - Path=/api/v1/mini/**,/api/v1/members/**

            - id: backend-core-swagger
              uri: lb://backend-core
              predicates:
                - Path=/api/v1/backend-core/**
              filters:
                - RewritePath=/api/v1/backend-core/(?<segment>.*), /api/v1/${segment}
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_SERVICE_URL}/eureka

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    urls:
      - name: backend-map
        url: /api/v1/backend-map/v3/api-docs
      - name: backend-core
        url: /api/v1/backend-core/v3/api-docs
