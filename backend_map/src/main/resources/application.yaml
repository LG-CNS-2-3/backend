server:
  port: 8080

spring:
  application:
    name: backend_map

  datasource:
    url: jdbc:mariadb://localhost:3306/yogijogi
    username: example
    password: example
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
      show_sql: true
      format_sql: true

    logging:
      level:
        org.hibernate.type.descriptor.sql: trace

