version: "3.8"

name: yogijogi
services:
  db:
    image: mariadb:11.3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yogijogi
      MYSQL_USER: example
      MYSQL_PASSWORD: example
      TZ: 'Asia/Seoul'
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: